name: PowerShell compatibility

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: ${{ matrix.engine }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: Windows PowerShell 5.1
            shell: powershell
          - engine: PowerShell 7
            shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Parse script and run compatibility regression tests
        shell: ${{ matrix.shell }}
        run: ./tests/Compatibility.Tests.ps1
